recorder:
  exclude:
    entities:
      - select.sprinkler_program
      - select.sprinkler_valve

logbook:
  exclude:
    entities:
      - select.sprinkler_program
      - select.sprinkler_valve


template:


  # ------------- Sprinkler Program Select -------------------
  - triggers:
      - trigger: state
        entity_id: sensor.sprinkler_config
        not_to: unavailable

    variables:
      programs: "{{ state_attr('sensor.sprinkler_config','programs').keys()|list}}"

    select:
      - name: Sprinkler program
        default_entity_id: select.sprinkler_program
        unique_id: select_sprinkler_program_id
        optimistic: true
        options: "{{ programs }}"



  # --------------- Sprinkler Valve Select ---------------
  - triggers:
      - trigger: state
        entity_id: select.sprinkler_program

    # Catch unloading
    conditions:
      - "{{ trigger.to_state != None }}"

    variables:
      # Can't use trigger.to_state.state because it's not defined when unloading templates
      # And variables seem to be processed before conditions
      primary: "{{ states('select.sprinkler_program') }}"
      programs: "{{ state_attr('sensor.sprinkler_config','programs').get(primary,{}).keys()|list }}"


    select:
      - name: Sprinkler valve
        default_entity_id: select.sprinkler_valve
        unique_id: select_sprinkler_valve_id
        optimistic: true
        options: "{{ programs }}"


